<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Save to Graphin</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #2563eb;
        --border: #c9d1de;
        --muted: #6b7587;
        --danger: #c62828;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      .readonly {
        opacity: 0.7;
      }
      button {
        font: inherit;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 7px 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .status {
        margin-top: 10px;
        min-height: 1.4em;
      }
      .status.error {
        color: var(--danger);
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Save to Graphin</h1>

    <label>
      Network
      <select id="network" disabled>
        <option>Loading…</option>
      </select>
    </label>

    <label>
      Title
      <input id="title" maxlength="255" />
    </label>

    <label>
      Link
      <input id="url" class="readonly" readonly />
    </label>

    <label>
      Commentary (highlighted text and your notes)
      <textarea id="commentary" maxlength="20000"></textarea>
    </label>

    <div class="row">
      <a href="#" id="options" class="muted">Settings</a>
      <button id="save" disabled>Save</button>
    </div>

    <p id="status" class="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
