<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .tile {
        width: 440px;
        height: 280px;
        background: linear-gradient(135deg, #1e3a5f 0%, #2a4f7f 60%, #3b6ea5 100%);
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 34px;
        box-sizing: border-box;
        position: relative;
      }
      .mark {
        flex: 0 0 auto;
        width: 120px;
        height: 120px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.4;
        color: #dbe7f5;
      }
      .tag {
        display: inline-block;
        margin-top: 16px;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M36 44 L64 64 L94 40" />
          <path d="M64 64 L88 94" />
        </g>
        <circle cx="36" cy="44" r="14" fill="#6aa9ff" stroke="#ffffff" stroke-width="5" />
        <circle cx="64" cy="64" r="17" fill="#f59e0b" stroke="#ffffff" stroke-width="5" />
        <circle cx="94" cy="40" r="12" fill="#34d399" stroke="#ffffff" stroke-width="5" />
        <circle cx="88" cy="94" r="11" fill="#a78bfa" stroke="#ffffff" stroke-width="5" />
      </svg>
      <div>
        <h1>Graphin Save</h1>
        <p>Save any page, link or highlighted text straight into your Graphin network.</p>
        <span class="tag">Right-click or use the toolbar</span>
      </div>
    </div>
  </body>
</html>
