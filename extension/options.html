<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graphin Save: settings</title>
    <style>
      body {
        max-width: 520px;
        margin: 40px auto;
        padding: 0 16px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      select,
      button {
        font: inherit;
        padding: 6px 10px;
      }
      .muted {
        color: #6b7587;
      }
      .ok {
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h1>Graphin Save</h1>
    <p class="muted">Choose where Graphin is running. Log in to Graphin at this address in the same browser, then saving will work.</p>

    <label>
      Graphin address
      <select id="address">
        <option value="https://graphin.org/index.php">https://graphin.org (live site)</option>
      </select>
    </label>

    <button id="save">Save settings</button>
    <p id="message"></p>

    <script type="module" src="options.js"></script>
  </body>
</html>
